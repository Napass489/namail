<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <!-- ป้องกันหน้าเว็บซูมเองบนมือถือและ iPad (ล็อกสเกลต่ำสุด-สูงสุดและรองรับขอบจอปลอดภัย) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ครัวของเนเมล 🐤 | เช็กคิว</title>
  <meta property="og:title" content="ครัวของเนเมล 🐤 | เช็กคิว" />
  <meta property="og:description" content="เช็กสถานะและความคืบหน้าออเดอร์ของคุณ" />
  <meta property="og:image" content="https://i.postimg.cc/zf3FVRMX/IMG-9620.jpg" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- โหลดฟอนต์ภาษาไทยโทนกลมมนอ่านง่าย (Mitr + Prompt) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- โหลด Tone.js สำหรับเสียงเพลงกล่องดนตรีพาสเทล (พร้อมระบบสำรอง Web Audio ในตัว) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

  <!-- โหลด Tailwind CSS สำหรับจัดวางและปรับขนาดตามหน้าจอ -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            cute: ['Mitr', 'Prompt', 'sans-serif'],
            sans: ['Prompt', 'sans-serif'],
          },
          colors: {
            cocoa: '#5C2F2B',
            'cocoa-light': '#967274',
            'cocoa-soft': '#B9989C',
            rosebtn: '#E3638C',
          },
        },
      },
    };
  </script>

  <style>
    /* =========================================================================
       สไตล์หลักธีมชมพูนม ขาวนม และน้ำตาลโกโก้ + ป้องกันเว็บซูมเองบน iOS/iPadOS
       ========================================================================= */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      overflow-x: hidden;
      font-family: 'Prompt', sans-serif;
      color: #5C2F2B;
      background: radial-gradient(circle at 50% 0%, #FFF9FB 0%, #FFEFF5 58%, #FCE3EE 100%);
      -webkit-text-size-adjust: 100% !important;
      text-size-adjust: 100% !important;
      touch-action: pan-y;
      overscroll-behavior: none;
    }

    #app-shell, #app-content {
      touch-action: pan-y;
      overscroll-behavior-y: contain;
    }

    /* บังคับขนาดฟอนต์ช่องกรอกเป็น 16px เพื่อป้องกัน Safari บน iPhone/iPad ซูมหน้าจออัตโนมัติตอนแตะพิมพ์ */
    input, select, textarea,
    input:focus, select:focus, textarea:focus {
      font-size: 16px !important;
      touch-action: manipulation;
    }

    button, a {
      touch-action: manipulation;
    }

    /* พื้นหลังภายในกรอบแอปโทนชมพูนมละมุน */
    .app-canvas {
      background: linear-gradient(180deg, #FFF7FA 0%, #FFF3F7 52%, #FFF8FA 100%);
    }

    /* ซ่อนสโครลบาร์ให้ดูสะอาดเหมือนแอปมือถือ */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* การ์ดขาวขอบบางเงานุ่ม */
    .clean-card {
      background: #FFFFFF;
      border: 1px solid #F6DDE8;
      box-shadow: 0 8px 24px -14px rgba(194, 118, 148, 0.24);
    }

    /* ช่องกรอกข้อความขอบนุ่ม */
    .clean-input {
      background: #FFFBFD;
      border: 1.5px solid #F3D4E1;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }
    .clean-input:focus {
      border-color: #E8709B;
      background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(238, 121, 163, 0.16);
    }

    /* ปุ่มชมพูกุหลาบแบบทึบละมุน */
    .btn-rose-solid {
      background: linear-gradient(180deg, #F07EA8 0%, #E3638C 100%);
      color: #FFFFFF;
      box-shadow: 0 8px 18px -6px rgba(227, 99, 140, 0.48);
      transition: transform 0.14s ease, filter 0.18s ease, box-shadow 0.18s ease;
    }
    .btn-rose-solid:hover {
      filter: brightness(1.03);
    }
    .btn-rose-solid:active {
      transform: scale(0.985);
      box-shadow: 0 4px 10px -4px rgba(227, 99, 140, 0.45);
    }

    /* แถบชื่อหน้าแบบกระจกฝ้าบนแบนเนอร์ (สไตล์รูปที่ 2) */
    .banner-glass-pill {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: 0 6px 18px -8px rgba(196, 114, 148, 0.34);
    }

    /* แบนเนอร์ส่วนบนไล่เฟดกลืนลงพื้นหลังชมพูนม */
    .banner-fade-bottom {
      background: linear-gradient(
        180deg,
        rgba(255, 247, 250, 0) 0%,
        rgba(255, 247, 250, 0.25) 48%,
        rgba(255, 247, 250, 0.88) 84%,
        #FFF7FA 100%
      );
    }

    /* เงาอ่อน ๆ สำหรับภาพมาสคอต PNG */
    .mascot-png-shadow {
      filter: drop-shadow(0 8px 14px rgba(196, 118, 148, 0.22));
    }

    /* กล่องคำพูดมาสคอตฝั่งซ้าย (หางชี้ไปทางขวาหามาสคอต) */
    .mascot-speech-cute {
      position: relative;
      background: linear-gradient(180deg, #FFFFFF 0%, #FFF7FA 100%);
      border: 1.5px solid #F6CEE0;
      box-shadow: 0 10px 24px -14px rgba(212, 118, 156, 0.32);
    }
    .mascot-speech-cute::before {
      content: '';
      position: absolute;
      right: -10px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 8px solid transparent;
      border-bottom: 8px solid transparent;
      border-left: 10px solid #F6CEE0;
    }
    .mascot-speech-cute::after {
      content: '';
      position: absolute;
      right: -7.5px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 6.5px solid transparent;
      border-bottom: 6.5px solid transparent;
      border-left: 8.5px solid #FFF9FB;
    }

    /* กล่องแชทฝั่งซ้าย */
    .chat-pill {
      position: relative;
      background: #FFFFFF;
      border: 1px solid #F5D7E4;
      box-shadow: 0 4px 12px -6px rgba(198, 120, 152, 0.22);
    }
    .chat-pill::before {
      content: '';
      position: absolute;
      left: -7px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-right: 7px solid #F5D7E4;
    }
    .chat-pill::after {
      content: '';
      position: absolute;
      left: -5.5px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-right: 6px solid #FFFFFF;
    }

    /* กล่องแชทฝั่งขวา (สลับฝั่งซ้าย-ขวาแบบแชทจริงบนหน้าหลัก) */
    .chat-pill-right {
      position: relative;
      background: linear-gradient(180deg, #FFF7FA 0%, #FFEBF3 100%);
      border: 1px solid #F6CBE0;
      box-shadow: 0 4px 12px -4px rgba(212, 120, 158, 0.2);
    }
    .chat-pill-right::before {
      content: '';
      position: absolute;
      right: -7px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 7px solid #F6CBE0;
    }
    .chat-pill-right::after {
      content: '';
      position: absolute;
      right: -5.5px;
      top: 50%;
      transform: translateY(-50%);
      width: 0;
      height: 0;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      border-left: 6px solid #FFF1F6;
    }

    /* การ์ดไฮไลต์ "กำลังทำ" พื้นชมพูไล่เฉดละมุน */
    .doing-pink-card {
      background: linear-gradient(135deg, #FFE4EE 0%, #FFF2F7 56%, #FFEBF3 100%);
      border: 1.5px solid #F6C6DA;
      box-shadow: 0 10px 24px -14px rgba(227, 99, 140, 0.34);
    }

    /* แถบแสงวิ่งละมุนบน Progress Bar */
    @keyframes shimmerMove {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(220%); }
    }
    .shimmer-bar {
      position: relative;
      overflow: hidden;
    }
    .shimmer-bar::after {
      content: '';
      position: absolute;
      inset: 0;
      width: 45%;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.58) 50%, rgba(255,255,255,0) 100%);
      animation: shimmerMove 2.2s ease-in-out infinite;
    }

    /* ไอคอนดอกไม้ขยับเบา ๆ */
    @keyframes flowerFloat {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-2.5px) rotate(6deg); }
    }
    .flower-float {
      animation: flowerFloat 3s ease-in-out infinite;
    }

    /* ลูกเล่นไทม์ไลน์หน้าคิวทั้งหมด (วงสีน้ำเงิน) */
    @keyframes timelineBeadFlow {
      0% { top: 8%; opacity: 0; }
      18% { opacity: 1; }
      82% { opacity: 1; }
      100% { top: 92%; opacity: 0; }
    }
    .timeline-rail-glow {
      background: linear-gradient(180deg, #F695BA 0%, #F9C4D9 52%, #FADCE8 100%);
      box-shadow: 0 0 8px rgba(238, 121, 163, 0.35);
    }
    .timeline-flow-bead {
      animation: timelineBeadFlow 2.8s ease-in-out infinite;
      box-shadow: 0 0 10px 2px rgba(238, 115, 160, 0.55);
    }

    /* ลูกเล่นมาสคอตและแถบความคืบหน้าในหน้าคิวของฉัน (วงสีฟ้า) */
    @keyframes mascotBreathe {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(1.2deg); }
    }
    .mascot-float {
      animation: mascotBreathe 3.4s ease-in-out infinite;
    }

    @keyframes mascotTapJump {
      0% { transform: scale(1) translateY(0); }
      35% { transform: scale(1.09) translateY(-8px) rotate(-2.5deg); }
      70% { transform: scale(0.97) translateY(1px) rotate(1.5deg); }
      100% { transform: scale(1) translateY(0); }
    }
    .mascot-jump {
      animation: mascotTapJump 0.48s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes heartFloatPop {
      0% { opacity: 0; transform: translate(-50%, 6px) scale(0.6); }
      25% { opacity: 1; transform: translate(-50%, -8px) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -34px) scale(0.95); }
    }
    .heart-pop {
      animation: heartFloatPop 0.9s ease-out forwards;
    }

    @keyframes twinkleSoft {
      0%, 100% { opacity: 0.45; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }
    .twinkle-soft {
      animation: twinkleSoft 2.1s ease-in-out infinite;
    }

    @keyframes stepHop {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3.5px); }
    }
    .step-bunny-bounce {
      animation: stepHop 1.5s ease-in-out infinite;
    }

    @keyframes stepPulseRing {
      0% { box-shadow: 0 0 0 0 rgba(238, 121, 163, 0.45); }
      70% { box-shadow: 0 0 0 8px rgba(238, 121, 163, 0); }
      100% { box-shadow: 0 0 0 0 rgba(238, 121, 163, 0); }
    }
    .step-active-glow {
      animation: stepPulseRing 1.9s ease-out infinite;
    }

    /* แถบคลื่นเสียงดุ๊กดิ๊กสำหรับปุ่มเสียงเพลง */
    @keyframes eqDance {
      0%, 100% { height: 4px; }
      50% { height: 12px; }
    }
    .eq-bar-1 { animation: eqDance 0.65s ease-in-out infinite; }
    .eq-bar-2 { animation: eqDance 0.52s ease-in-out 0.15s infinite; }
    .eq-bar-3 { animation: eqDance 0.72s ease-in-out 0.3s infinite; }

    /* แอนิเมชันเข้าหน้าและหน้าต่างป๊อปอัป */
    @keyframes pageFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .page-enter {
      animation: pageFadeIn 0.24s ease-out;
    }

    @keyframes sheetSlideUp {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .sheet-enter {
      animation: sheetSlideUp 0.24s ease-out;
    }

    /* หน้าโหลดเข้าเว็บธีมชมพูนมน่ารัก */
    .splash-backdrop {
      background: radial-gradient(circle at 50% 25%, #FFFFFF 0%, #FFF2F7 48%, #FCE3EE 100%);
      transition: opacity 0.42s ease, visibility 0.42s ease;
    }
    .splash-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ลูกเล่นแสงฟุ้ง ๆ ออกจากโลโก้ในหน้าดาวน์โหลด */
    @keyframes logoMistAuraPulse {
      0%, 100% {
        opacity: 0.65;
        transform: scale(0.92);
      }
      50% {
        opacity: 0.96;
        transform: scale(1.12);
      }
    }
    @keyframes logoMistRingOut {
      0% {
        opacity: 0.72;
        transform: scale(0.62);
      }
      70% {
        opacity: 0.25;
      }
      100% {
        opacity: 0;
        transform: scale(1.68);
      }
    }
    @keyframes logoMistFloatOut {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(0px, 0px) scale(0.45);
      }
      24% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.45;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--mx, 0px), var(--my, -48px)) scale(1.18);
      }
    }
    .logo-mist-aura {
      background: radial-gradient(circle, rgba(255, 255, 255, 0.96) 0%, rgba(255, 206, 228, 0.78) 42%, rgba(247, 166, 202, 0.24) 72%, rgba(255, 236, 245, 0) 100%);
      filter: blur(12px);
      animation: logoMistAuraPulse 2.8s ease-in-out infinite;
    }
    .logo-mist-ring {
      border: 1.5px solid rgba(246, 164, 201, 0.58);
      box-shadow: 0 0 18px rgba(255, 192, 221, 0.55);
      filter: blur(1.2px);
      animation: logoMistRingOut 2.8s cubic-bezier(0.22, 1, 0.36, 1) infinite;
    }
    .logo-mist-orb {
      border-radius: 9999px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.98) 0%, rgba(255, 186, 217, 0.82) 55%, rgba(255, 186, 217, 0) 100%);
      filter: blur(1.8px);
      animation: logoMistFloatOut 2.9s ease-out infinite;
    }
    .logo-mist-spark {
      filter: drop-shadow(0 0 6px rgba(244, 150, 192, 0.72));
      animation: logoMistFloatOut 3.1s ease-out infinite;
    }

    /* ลูกเล่นรูปตัวคิว (ไม่มีกรอบ พื้นโปร่งใส ลอยเด้งนุ่ม ๆ พร้อมแสงฟุ้งและประกายวิ้ง) */
    @keyframes queueAvatarFloat {
      0%, 100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(-2.5px) rotate(2.2deg);
      }
    }
    @keyframes queueAvatarGlow {
      0%, 100% {
        opacity: 0.38;
        transform: scale(0.9);
      }
      50% {
        opacity: 0.76;
        transform: scale(1.12);
      }
    }
    .queue-avatar-charm {
      animation: queueAvatarFloat 2.8s ease-in-out infinite;
      filter: drop-shadow(0 3px 6px rgba(232, 120, 164, 0.24));
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    }
    .queue-avatar-charm:hover,
    .group:hover .queue-avatar-charm {
      filter: drop-shadow(0 4px 10px rgba(236, 114, 162, 0.42));
    }
    .queue-avatar-aura {
      background: radial-gradient(circle, rgba(255, 200, 224, 0.68) 0%, rgba(255, 220, 236, 0) 72%);
      filter: blur(4px);
      animation: queueAvatarGlow 2.6s ease-in-out infinite;
    }

    /* ลูกเล่นแสงฟุ้งนุ่ม ๆ เวลาแตะหน้าจอ (ไม่ใช้อิโมจิ) */
    @keyframes tapMistBloom {
      0% {
        opacity: 0.78;
        transform: translate(-50%, -50%) scale(0.28);
      }
      50% {
        opacity: 0.48;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.65);
      }
    }
    @keyframes tapMistRing {
      0% {
        opacity: 0.72;
        transform: translate(-50%, -50%) scale(0.35);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.9);
      }
    }
    @keyframes tapOrbDrift {
      0% {
        opacity: 0.9;
        transform: translate(-50%, -50%) translate(0px, 0px) scale(0.5);
      }
      45% {
        opacity: 0.85;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) translate(var(--dx, 0px), var(--dy, -26px)) scale(1.15);
      }
    }
    .tap-mist-aura {
      position: fixed;
      width: 84px;
      height: 84px;
      border-radius: 9999px;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.92) 0%, rgba(255, 198, 224, 0.72) 38%, rgba(246, 152, 194, 0.28) 68%, rgba(255, 232, 243, 0) 100%);
      filter: blur(7px);
      animation: tapMistBloom 0.76s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .tap-mist-ring {
      position: fixed;
      width: 52px;
      height: 52px;
      border-radius: 9999px;
      pointer-events: none;
      border: 1.5px solid rgba(245, 160, 198, 0.65);
      box-shadow: 0 0 14px rgba(255, 184, 216, 0.55);
      filter: blur(0.8px);
      animation: tapMistRing 0.68s ease-out forwards;
    }
    .tap-mist-orb {
      position: fixed;
      border-radius: 9999px;
      pointer-events: none;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.96) 0%, rgba(255, 186, 217, 0.78) 60%, rgba(255, 186, 217, 0) 100%);
      filter: blur(1.4px);
      animation: tapOrbDrift 0.78s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .tap-mist-spark {
      position: fixed;
      pointer-events: none;
      filter: drop-shadow(0 0 5px rgba(245, 148, 190, 0.75));
      animation: tapOrbDrift 0.82s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-[100dvh] flex items-center justify-center sm:p-5">

  <!-- โครงสร้างหลักของแอป: เต็มจอบนมือถือ และจัดกึ่งกลางในกรอบขอบมนบน iPad/คอมพิวเตอร์ -->
  <div id="app-shell"
       class="relative z-10 w-full min-h-[100dvh] sm:min-h-[740px] sm:h-[88dvh] sm:max-h-[840px] sm:max-w-[404px] app-canvas flex flex-col sm:rounded-[2.4rem] sm:border-[5px] sm:border-white sm:shadow-[0_22px_52px_-16px_rgba(196,120,150,0.30)] overflow-hidden">

    <!-- หน้าโหลดเข้าเว็บน่ารัก ๆ เข้าธีม (แสดงตอนเปิดเว็บหรือกดดูซ้ำได้) -->
    <div id="cute-splash-loader"
         aria-label="กำลังโหลดหน้าเว็บ"

      document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
      document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });
      // ป้องกันการจีบ 2 นิ้วซูม (Multi-touch pinch zoom)
      document.addEventListener(
        'touchstart',
        (e) => {
          if (e.touches && e.touches.length > 1) {
            e.preventDefault();
          }
        },
        { passive: false }
      );
      document.addEventListener(
        'touchmove',
        (e) => {
          if ((e.touches && e.touches.length > 1) || (typeof e.scale === 'number' && e.scale !== 1)) {
            e.preventDefault();
          }
        },
        { passive: false }
      );
      // ป้องกันการซูมด้วย Trackpad / เมาส์ (Ctrl/Cmd + Scroll) และคีย์ลัดซูม

        'wheel',

          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();

        { passive: false }

        if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) {
          e.preventDefault();

        const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';

          e.preventDefault();

        'touchend',
        (e) => {
          const now = Date.now();
          if (now - lastTouchEndTime <= 300) {
            const tag = e.target && e.target.tagName ? e.target.tagName.toLowerCase() : '';
            if (tag !== 'input' && tag !== 'textarea' && tag !== 'select') {
              e.preventDefault();
            }

      function resultOf(result) {
        if (result.error) throw result.error;

      function httpUrl(value) {
        try {
          const url = new URL(value);
          return ['https:', 'http:'].includes(url.protocol) ? url.href : '';
        } catch { return ''; }
      }
      
      const queueFields = {
        code: 'code', status: 'status_id', customerName: 'customer_name', service: 'service',
        usageRights: 'usage_rights', dueDate: 'due_date', workStep: 'work_step', details: 'details',
        note: 'note', progressPercent: 'progress_percent', avatarPreset: 'avatar_preset', avatarUrl: 'avatar_url',
          };
        function toQueueRow(queue) {
          return Object.fromEntries(Object.entries(queueFields)
            .filter(([name]) => Object.hasOwn(queue, name))
            .map(([name, column]) => [column, queue[name]]));
      }
      function fromQueueRow(row) {
        const queue = Object.fromEntries(Object.entries(queueFields).map(([name, column]) => [name, row[column]]));
        queue.avatarUrl = httpUrl(queue.avatarUrl);
        queue.id = row.id;
        queue.version = row.updated_at;
        queue.updatedAt = row.updated_at ? new Intl.DateTimeFormat('th-TH', {
          dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Bangkok',
        }).format(new Date(row.updated_at)) : '';
        return queue;
          }
          
          async function loadQueues() {
            const rows = [];
            const fields = ['id', 'updated_at', ...Object.values(queueFields)].join(',');
            const pageSize = 250;
            for (let offset = 0; ; offset += pageSize) {
              const page = resultOf(await db.from('queues').select(fields).order('sort_order')
                .order('created_at').order('id').range(offset, offset + pageSize - 1));
              rows.push(...page);
              if (page.length < pageSize) return rows.map(fromQueueRow);
            }
          }
          
          async function refreshData() {
            if (loadingData) return loadingData;
            loadingData = (async () => {
              if (!db) throw new Error('Supabase client unavailable');
              const [shopResult, contactResult, statusResult, queues] = await Promise.all([
                db.from('shop_settings').select('shop_name,shop_subtitle,banner_image_url,mascot_image_url,share_template').eq('id', 1).single(),
                db.from('contact_channels').select('id,label,sublabel,url,theme,sort_order').order('sort_order').order('id'),
                db.from('queue_statuses').select('id,label,category,color,default_progress,progress_step,sort_order').order('sort_order').order('id'),
                loadQueues(),
              ]);
              const shop = resultOf(shopResult);
              const contactChannels = resultOf(contactResult).map((ch) => ({ ...ch, url: httpUrl(ch.url) }));
              const statusOptions = resultOf(statusResult);
              appData = {
                shopName: shop.shop_name, shopSubtitle: shop.shop_subtitle,
                bannerImageUrl: httpUrl(shop.banner_image_url) || DEFAULT_CONFIG.bannerImageUrl,
                mascotImageUrl: httpUrl(shop.mascot_image_url) || DEFAULT_CONFIG.mascotImageUrl,
                shareTemplate: shop.share_template || DEFAULT_CONFIG.shareTemplate,
                queues, contactChannels, statusOptions,
              };
              dataReady = true;
              dataError = false;
            })();
            try { await loadingData; } finally { loadingData = null; }
            }
            
            async function loadPublic({ openLink = false } = {}) {

                    uiState.searchInputValue = normalizeQueueCode(code);

                  }

                document.title = `${appData.shopName} | เช็กคิว`;

                dataError = true;
                console.warn('Could not load queue data', error);

        return Boolean(row);

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }
      function normalizeQueueCode(raw) {
        return String(raw || '').trim().toUpperCase();
      }
      
      function getStatusMeta(statusId) {
        const list =
          Array.isArray(appData.statusOptions) && appData.statusOptions.length
            ? appData.statusOptions
            : DEFAULT_CONFIG.statusOptions;
        const found = list.find((s) => s.id === statusId);
        if (found) {
          const style = STATUS_COLOR_STYLES[found.color] || STATUS_COLOR_STYLES.pink;
          return { ...found, badgeClass: style.badge, hexBg: style.hexBg, hexText: style.hexText };
        }
        const fallbackCategory = statusId === 'doing' ? 'doing' : statusId === 'done' ? 'done' : 'waiting';
        const fallbackColor = fallbackCategory === 'doing' ? 'peach' : fallbackCategory === 'done' ? 'mint' : 'pink';
        const style = STATUS_COLOR_STYLES[fallbackColor];
        return {
          id: statusId || 'waiting',
          label: fallbackCategory === 'doing' ? 'กำลังทำ' : fallbackCategory === 'done' ? 'เสร็จแล้ว' : 'รอคิว',
          category: fallbackCategory,
          color: fallbackColor,
          badgeClass: style.badge,
          hexBg: style.hexBg,
          hexText: style.hexText,
        };
      }
      function getStatusCategory(statusId) {
        return getStatusMeta(statusId).category;
      }
      function getDoingQueue() {
        return appData.queues.find((q) => getStatusCategory(q.status) === 'doing') || null;
      }
      function getWaitingQueues() {
        return appData.queues.filter((q) => getStatusCategory(q.status) === 'waiting');
      }
      function getDoneQueues() {
        return appData.queues.filter((q) => getStatusCategory(q.status) === 'done');
      }
      function findQueueByCode(rawCode) {
        const target = normalizeQueueCode(rawCode);
        if (!target) return null;
        return appData.queues.find((q) => normalizeQueueCode(q.code) === target) || null;
      }
      function generateNextQueueCode() {
        let maxNum = 0;
        let prefix = 'Q-';
        let padLen = 2;
        appData.queues.forEach((q) => {
          const match = String(q.code || '').trim().match(/^([A-Za-zก-๙_-]*?)(\d+)$/);
          if (match) {
            prefix = match[1] || 'Q-';
            padLen = Math.max(padLen, match[2].length);
            const n = parseInt(match[2], 10);
            if (!Number.isNaN(n) && n > maxNum) maxNum = n;
          }
        });
        const nextNum = String(maxNum + 1).padStart(padLen, '0');
        return `${prefix}${nextNum}`;
      }
      function buildQueueDirectLink(code) {
        const cleanCode = encodeURIComponent(normalizeQueueCode(code));
        try {
          if (window.location.href && /^https?:\/\//i.test(window.location.href)) {
            const url = new URL(window.location.href);
            url.searchParams.set('queue', normalizeQueueCode(code));
            url.hash = '';
            return url.toString();
          }
          const base = String(window.location.href || '').split('?')[0].split('#')[0];
          if (base && !base.startsWith('about:')) {
            return `${base}?queue=${cleanCode}`;
          }
        } catch (err) {
          // fallback ด้านล่าง
        }
        return `https://your-shop-queue.example/?queue=${cleanCode}`;
      }

          .replace(/\{details\}/g, () => queue.details || '-')
          .replace(/\{link\}/g, () => link);
      }
      function copyTextToClipboard(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = String(text || '');
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          return ok;

          : `
            <div class="doing-pink-card rounded-[1.3rem] px-3.5 py-2.5 flex items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <div class="flower-float">${getDoingFlowerSvg('w-6 h-6')}</div>

              <span class="text-[11px] font-cute text-[#B65479]">รอ ${waitingQueues.length} คิว</span>
            </div>
          `;

        const bunnyCycle = ['lavender', 'yellow', 'blue', 'pink'];
        const liveChatSteps = [];
        if (doingQueue) {
          liveChatSteps.push({
            prefix: getStatusMeta(doingQueue.status).label,
            queue: doingQueue,
            code: doingQueue.code,
            subNote: doingQueue.workStep || '',
            fallbackVariant: 'pink',
            badgeType: 'doing',
          });
        } else {
          liveChatSteps.push({
            prefix: 'ตอนนี้ยังไม่มีคิวที่กำลังทำ',
            queue: null,
            code: '',
            subNote: '',
            fallbackVariant: 'pink',
            badgeType: 'empty',
          });
        }
        waitingQueues.slice(0, 4).forEach((wq, idx) => {
          liveChatSteps.push({
            prefix: getStatusMeta(wq.status).label,
            queue: wq,
            code: wq.code,
            subNote: wq.dueDate ? `ส่ง ${wq.dueDate}` : '',

            badgeType: 'waiting',
          });

        const alternatingChatFeedHtml = `
          <div class="clean-card rounded-[1.5rem] p-3.5 space-y-2.5">
            <div class="flex items-center justify-between px-1 pb-1.5 border-b border-[#F8E6EE]">
              <div class="inline-flex items-center gap-1.5 text-[11px] font-cute font-semibold text-[#C84977]">
                <span class="text-[#F08CB0]">♡</span>
                <span>แชทลำดับคิวตอนนี้</span>
              </div>
              <span class="text-[10px] font-cute text-cocoa-soft">แตะคิวเพื่อดูรายละเอียด</span>
            </div>
            <div class="space-y-2.5 pt-0.5" aria-label="แชทคิวปัจจุบันและคิวถัดไปสลับฝั่ง">
              ${liveChatSteps
                .map((step, idx) => {
                  const isRight = idx % 2 === 1;
                  const isDoing = step.badgeType === 'doing';
                  const pillColors = isDoing
                    ? 'bg-[#FCE4EC] text-[#C84A76] border border-[#F4C6D6]'
                    : isRight
                    ? 'bg-white text-cocoa border border-[#F4CFE0]'
                    : 'bg-[#FFF0F5] text-cocoa border border-[#F4D6E1]';
                  const clickableAttr = step.code ? `data-open-queue="${escapeHtml(step.code)}"` : '';
                  const tag = step.code ? 'button' : 'div';
                  const typeAttr = step.code ? 'type="button"' : '';
                  const avatarHtml = renderQueueAvatar(step.queue, step.fallbackVariant, 'w-9 h-9', idx);
                  const bubbleClass = isRight ? 'chat-pill-right text-right' : 'chat-pill text-left';
                  const bubbleInnerHtml = `
                    <${tag} ${typeAttr} ${clickableAttr}
                      class="${bubbleClass} rounded-2xl px-3 py-2 inline-flex flex-col ${isRight ? 'items-end' : 'items-start'} max-w-[78%] ${
                        step.code ? 'hover:border-[#EE9FC0] active:scale-[0.98] transition-all cursor-pointer' : ''
                      }">
                      <div class="flex items-center flex-wrap gap-1.5 ${isRight ? 'justify-end' : 'justify-start'}">
                        <span class="font-cute font-medium text-[13px] text-cocoa">
                          ${escapeHtml(step.prefix)}
                        </span>
                        ${
                          step.code
                            ? `<span class="inline-block font-cute font-semibold text-[13px] px-2.5 py-0.5 rounded-full ${pillColors}">${escapeHtml(step.code)}</span>`
                            : ''
                        }
                      </div>
                      ${
                        step.subNote
                          ? `<span class="text-[10px] text-cocoa-light leading-snug mt-0.5">${escapeHtml(step.subNote)}</span>`
                          : ''
                      }
                    </${tag}>
                  `;
                  return isRight
                    ? `
                      <div class="flex items-center justify-end gap-2">
                        ${bubbleInnerHtml}
                        ${avatarHtml}
                      </div>
                    `
                    : `
                      <div class="flex items-center justify-start gap-2">
                        ${avatarHtml}
                        ${bubbleInnerHtml}
                      </div>
                    `;
                })
                .join('')}
            </div>
            ${
              waitingQueues.length > 4
                ? `
                  <div class="text-center pt-1">
                    <span class="text-[11px] font-cute text-cocoa-light">และอีก ${waitingQueues.length - 4} คิวในหน้า “คิวทั้งหมด”</span>
                  </div>
                `
                : ''
            }
          </div>
        `;
        return `
          <section class="page-enter">
            ${renderUnifiedBanner({ title: 'เช็กคิวของฉัน', iconSvg: searchBannerIcon })}
            <div class="px-4 pt-2 space-y-3">
              <form id="queue-search-form" novalidate class="clean-card rounded-[1.7rem] p-4 sm:p-5">
                <label for="queue-code-input" class="block font-cute font-semibold text-[15px] text-cocoa mb-2 pl-0.5">
                  กรอกรหัสคิว
                </label>
                <div class="relative flex items-center">
                  <span class="absolute left-3.5 text-cocoa-soft pointer-events-none" aria-hidden="true">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="11" cy="11" r="7"></circle>
                      <path d="M20 20L16.2 16.2"></path>
                    </svg>
                  </span>
                  <input
                    id="queue-code-input"
                    type="text"
                    inputmode="text"
                    autocomplete="off"
                    autocapitalize="characters"
                    spellcheck="false"
                    value="${escapeHtml(uiState.searchInputValue)}"
                    placeholder="เช่น Q-01"
                    aria-describedby="search-hint search-error"
                    class="clean-input w-full pl-10 pr-10 py-3 rounded-2xl ${uiState.searchError ? '!border-[#E0537F] !bg-[#FFF5F8]' : ''} focus:outline-none font-cute font-semibold text-cocoa placeholder:font-normal placeholder:text-[#CBB0B5]"
                  />
                  <button
                    type="button"
                    id="clear-search-btn"
                    aria-label="ล้างรหัสคิว"
                    class="${hasInput ? 'flex' : 'hidden'} absolute right-3 w-6 h-6 rounded-full bg-[#E7D4DA] hover:bg-[#DBBFC8] text-white items-center justify-center transition-colors">
                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round">
                      <path d="M18 6L6 18M6 6l12 12"></path>
                    </svg>
                  </button>
                </div>
                
                <div id="search-error" role="alert" class="${uiState.searchError ? 'block' : 'hidden'} mt-2.5 rounded-xl bg-[#FFF0F5] border border-[#F3C2D3] px-3.5 py-2 text-xs text-[#C23B67] font-medium">
                  ${escapeHtml(uiState.searchError)}
                </div>
                <button
                  type="submit"
                  class="btn-rose-solid mt-4 w-full py-3.5 px-5 rounded-full font-cute font-semibold text-[16px] flex items-center justify-center gap-2 cursor-pointer">
                  <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M20 20L16.2 16.2"></path>
                  </svg>
                  <span>ค้นหาคิว</span>
                </button>
              </form>
              <!-- การ์ดกำลังทำขนาดกะทัดรัด (วงสีเหลือง) -->
              ${compactDoingCardHtml}
              <!-- กล่องแชทคิวต่อด้านล่างแบบสลับฝั่งซ้าย-ขวา -->
              ${alternatingChatFeedHtml}
            </div>
          </section>
        `;
      }
      /**
       * หน้า 2: หน้าคิวของฉัน ("มาสคอต + รายละเอียด กำหนดเสริฟ และความคืบหน้าของคิว")
       */
      function renderMyQueuePage() {
        const queue = findQueueByCode(uiState.selectedQueueCode);
        if (!queue) {
          uiState.activeView = 'check';
          return renderCheckPage();
        }
        const details = computeMyQueueDetails(queue);
        const statusMeta = getStatusMeta(queue.status);
        const statusBadgeClass = statusMeta.badgeClass;
        const statusText = statusMeta.label;
        const statusCat = statusMeta.category;
        const heartBannerIcon = `<span class="text-[#DF6E97] text-sm leading-none" aria-hidden="true">♡</span>`;
        // ขั้นตอนความคืบหน้า 4 ระดับพร้อมลูกเล่น (วงสีฟ้า)
        const progressStages = [
          { step: 1, label: 'รับคิว', emoji: '💌' },
          { step: 2, label: 'รอคิว', emoji: '🎀' },
          { step: 3, label: 'กำลังทำ', emoji: '✨' },
          { step: 4, label: 'เสร็จแล้ว', emoji: '🌸' },
        ];
        const progressStepperHtml = progressStages
          .map((item) => {
            const configured = appData.statusOptions.find(st => st.progress_step === item.step && st.id === queue.status)
              || appData.statusOptions.find(st => st.progress_step === item.step);
            const isCompleted = details.progressStep > item.step || (item.step === 4 && statusCat === 'done');
            const isCurrent = details.progressStep === item.step && !isCompleted;
            const dotClass = isCompleted
              ? 'bg-gradient-to-br from-[#F997BC] to-[#E96A98] text-white border-[#EE79A3] shadow-sm'
              : isCurrent
              ? 'bg-white text-[#E46391] border-2 border-[#EE79A3] step-active-glow scale-110'
              : 'bg-[#FFF5F9] text-[#CBA9B5] border border-[#F0D4E0]';
            const labelClass = isCompleted || isCurrent ? 'text-cocoa font-semibold' : 'text-cocoa-soft';
            return `
              <div class="relative z-10 flex flex-col items-center gap-1 flex-1 pt-5">
                ${
                  isCurrent
                    ? `<span class="absolute top-0 text-[13px] leading-none step-bunny-bounce select-none" aria-hidden="true">🐰</span>`
                    : isCompleted
                    ? `<span class="absolute top-1 text-[9px] text-[#F28BB1] twinkle-soft select-none" aria-hidden="true">✦</span>`
                    : ''
                }
                <div class="w-7 h-7 rounded-full flex items-center justify-center text-[11px] font-cute font-bold transition-all ${dotClass}">
                  ${
                    isCompleted
                      ? `<svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`
                      : isCurrent
                      ? `<span class="text-[12px] leading-none">${item.emoji}</span>`
                      : item.step
                  }
                </div>
                <span class="text-[11px] font-cute leading-none mt-0.5 ${labelClass}">${escapeHtml(configured && details.progressPercent >= configured.default_progress ? configured.label : '')}</span>
              </div>
            `;
          })
          .join('');
        return `
          <section class="page-enter">
            ${renderUnifiedBanner({ title: 'คิวของฉัน', iconSvg: heartBannerIcon, showBackBtn: true })}
            <div class="px-4 pt-2 space-y-3.5">
              <!-- กล่องข้อความน่ารักฝั่งซ้าย + มาสคอต PNG ฝั่งขวา (วงสีฟ้า) -->

                <div class="mascot-speech-cute flex-1 rounded-[1.75rem] px-4 py-4 min-h-[118px] flex items-center justify-center text-center">
                  <div class="w-full">
                    ${details.bubbleHtml}
                  </div>
                </div>
                <button
                  type="button"
                  id="interactive-mascot-btn"
                  aria-label="แตะมาสคอตเพื่อส่งกำลังใจ"
                  class="relative w-[39%] max-w-[146px] shrink-0 flex items-center justify-center cursor-pointer focus:outline-none group">
                  <div class="pointer-events-none absolute w-24 h-24 rounded-full bg-[#FFDCE9]/70 blur-xl group-hover:scale-110 transition-transform"></div>
                  <span class="pointer-events-none absolute top-1 left-1 text-[#F48BB2] text-xs twinkle-soft" aria-hidden="true">✦</span>
                  <span class="pointer-events-none absolute top-3 right-1 text-[#F7A1C1] text-[11px] twinkle-soft" style="animation-delay:0.7s" aria-hidden="true">♡</span>
                  <span class="pointer-events-none absolute bottom-1 right-2 text-[#F5B0CA] text-[10px] twinkle-soft" style="animation-delay:1.2s" aria-hidden="true">✦</span>
                  <div id="mascot-heart-layer" class="pointer-events-none absolute inset-0 overflow-visible"></div>
                  <div id="mascot-anim-wrap" class="w-full mascot-float">
                    ${renderMascotImage({
                      wrapperClass: 'w-full h-[132px]',
                      imgClass: 'scale-[1.06]',
                    })}
                  </div>
                </button>
              </div>
              <!-- การ์ด "คิวของคุณ" + ความคืบหน้า + กำหนดเสริฟและรายละเอียด (วงสีเขียว) -->
              <div class="clean-card rounded-[1.7rem] p-4 sm:p-5 space-y-4">
                <div class="text-center pb-3 border-b border-[#F8E6EE]">
                  <div class="flex items-center justify-center gap-1.5 font-cute font-medium text-[13px] text-cocoa-light">
                    ${renderQueueAvatar(queue, 'pink', 'w-6 h-6')}
                    <span>${queue.customerName ? `คิวของ ${escapeHtml(queue.customerName)}` : 'คิวของคุณ'}</span>
                  </div>
                  <div class="font-cute font-bold text-[38px] sm:text-[40px] text-cocoa tracking-wide leading-tight mt-0.5">
                    ${escapeHtml(queue.code)}
                  </div>
                  <div class="mt-2 flex justify-center">
                    <span class="inline-flex items-center justify-center px-4 py-1 rounded-full font-cute font-medium text-[12px] ${statusBadgeClass}">
                      ${escapeHtml(statusText)}
                    </span>
                  </div>
                </div>
                <!-- แถบความคืบหน้า 4 ขั้นตอน -->
                <div class="rounded-2xl bg-[#FFF8FB] border border-[#F8E1EC] px-3 pt-2.5 pb-3">
                  <div class="flex items-center justify-between mb-1">
                    <span class="font-cute font-semibold text-[13px] text-cocoa flex items-center gap-1">
                      <span class="text-[#EE7CA6]">✦</span>
                      <span>ความคืบหน้าคิวนี้</span>
                    </span>
                    <span class="px-2 py-0.5 rounded-full bg-white border border-[#F5D2E1] text-[11px] font-cute font-semibold text-[#D95A87]">
                      ${details.progressPercent}%
                    </span>
                  </div>
                  <div class="relative">
                    <div class="absolute left-[12%] right-[12%] top-[31px] h-2 rounded-full bg-[#F9E4EE] overflow-hidden">
                      <div class="relative h-full rounded-full bg-gradient-to-r from-[#FBA4C3] via-[#F282AA] to-[#E96797] transition-all duration-500 shimmer-bar" style="width: ${details.progressPercent}%"></div>
                    </div>
                    <div class="flex items-start justify-between">
                      ${progressStepperHtml}
                    </div>
                  </div>
                </div>
                <!-- ไฮไลต์: อัปเดตขั้นตอนงานตอนนี้ & กำหนดเสริฟ -->
                <div class="space-y-2">
                  <div class="rounded-2xl bg-[#FFF3F8] border border-[#F6D2E2] px-3.5 py-2.5 flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-full bg-white border border-[#F6D5E4] flex items-center justify-center text-[#DF628E] shrink-0">
                      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 20h9"></path>
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
                      </svg>
                    </div>
                    <div class="min-w-0">
                      <div class="text-[11px] font-cute text-[#C65C85]">อัปเดตขั้นตอนงานตอนนี้</div>
                      <div class="font-cute font-semibold text-[13px] text-cocoa leading-snug">
                        ${escapeHtml(queue.workStep || details.currentStageLabel)}
                      </div>
                    </div>
                  </div>
                  <div class="rounded-2xl bg-white border border-[#F6DCE8] px-3.5 py-2.5 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                      <div class="w-7 h-7 rounded-full bg-[#FFF2F7] flex items-center justify-center text-[#DF628E] shrink-0">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                          <line x1="16" y1="2" x2="16" y2="6"></line>
                          <line x1="8" y1="2" x2="8" y2="6"></line>
                          <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                      </div>
                      <span class="text-xs font-cute text-cocoa-light">กำหนดเสริฟ</span>
                    </div>
                    <span class="px-3 py-0.5 rounded-full bg-[#FFF5F9] border border-[#F5CEE0] font-cute font-semibold text-xs text-[#CC4B7A]">
                      ${escapeHtml(queue.dueDate || 'ตามลำดับคิว')}
                    </span>
                  </div>
                </div>
                <!-- รายละเอียดเพิ่มเติมของคิว -->
                <div class="rounded-2xl bg-[#FFF9FB] border border-[#F7E4EC] px-3.5 py-3 space-y-2 text-xs">
                  ${
                    queue.customerName
                      ? `
                        <div class="flex items-center justify-between gap-2">
                          <span class="text-cocoa-light">ชื่อออเดอร์</span>
                          <span class="font-cute font-semibold text-cocoa text-right">${escapeHtml(queue.customerName)}</span>
                        </div>
                        <div class="h-px bg-[#F8E8EF]"></div>
                      `
                      : ''
                  }
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-cocoa-light">สถานะลำดับ</span>
                    <span class="font-cute font-semibold text-cocoa text-right">${escapeHtml(details.currentStageLabel)}</span>
                  </div>
                  <div class="h-px bg-[#F8E8EF]"></div>
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-cocoa-light">เมนู</span>
                    <span class="font-cute font-medium text-cocoa text-right">${escapeHtml(queue.service || '-')}</span>
                  </div>
                  ${queue.usageRights ? `<div class="h-px bg-[#F8E8EF]"></div>
                  <div class="flex items-center justify-between gap-2"><span class="text-cocoa-light">สิทธิ์การใช้งาน</span><span class="text-right">${escapeHtml(queue.usageRights)}</span></div>` : ''}
                  ${
                    queue.details
                      ? `
                        <div class="h-px bg-[#F8E8EF]"></div>
                        <div class="flex items-start justify-between gap-3">
                          <span class="text-cocoa-light shrink-0">รายละเอียด</span>
                          <span class="text-cocoa text-right leading-relaxed">${escapeHtml(queue.details)}</span>
                        </div>
                      `
                      : ''
                  }
                  <div class="h-px bg-[#F8E8EF]"></div>
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-cocoa-light">เวลารอโดยประมาณ</span>
                    <span class="font-cute font-medium text-[#D15682] text-right">${escapeHtml(details.estimatedWaitText)}</span>
                  </div>
                  <div class="h-px bg-[#F8E8EF]"></div>
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-cocoa-light">อัปเดตล่าสุด</span>
                    <span class="font-cute font-medium text-cocoa text-right">${escapeHtml(queue.updatedAt || 'วันนี้')}</span>
                  </div>
                  ${
                    queue.note
                      ? `
                        <div class="pt-2 border-t border-dashed border-[#F3D6E2] text-[11px] text-cocoa-light flex items-start gap-1.5">
                          <span class="text-[#EE87AE] shrink-0">♡</span>
                          <span>${escapeHtml(queue.note)}</span>
                        </div>
                      `
                      : ''
                  }
                </div>
              </div>
              <!-- ปุ่มดาวน์โหลดบัตรคิวน่ารัก ๆ และปุ่มค้นหาคิวอื่น -->
              <div class="flex items-center justify-center gap-2 pb-1">
                <button
                  type="button"
                  id="open-download-card-btn"
                  data-download-queue="${escapeHtml(queue.code)}"
                  class="inline-flex items-center gap-1.5 text-xs font-cute font-semibold text-[#D6547E] hover:bg-[#FFEBF2] py-2 px-4 rounded-full bg-white border border-[#F4C8D8] shadow-xs transition-colors cursor-pointer">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                  </svg>
                  <span>ดาวน์โหลดบัตรคิว</span>
                </button>
                <button
                  type="button"
                  id="search-another-btn"
                  class="inline-flex items-center gap-1.5 text-xs font-cute font-medium text-cocoa-light hover:text-[#D6547E] py-2 px-4 rounded-full bg-white/80 border border-[#F6DFEA] transition-colors cursor-pointer">
                  <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="M20 20L16.2 16.2"></path>
                  </svg>
                  <span>ค้นหารหัสคิวอื่น</span>
                </button>
              </div>
            </div>
          </section>
        `;
      }
      /**

      const CuteMusicBox = (() => {
        let isPlaying = false;
        let stepIdx = 0;
        let loopTimer = null;
        let audioCtx = null;
        let toneSynth = null;
        const melody = [
          { note: 'C5', freq: 523.25 },
          { note: 'E5', freq: 659.25 },
          { note: 'G5', freq: 783.99 },
          { note: 'B5', freq: 987.77 },
          { note: 'A5', freq: 880.0 },
          { note: 'G5', freq: 783.99 },
          { note: 'E5', freq: 659.25 },
          { note: 'D5', freq: 587.33 },
          { note: 'F5', freq: 698.46 },
          { note: 'A5', freq: 880.0 },
          { note: 'C6', freq: 1046.5 },
          { note: 'A5', freq: 880.0 },
          { note: 'G5', freq: 783.99 },
          { note: 'E5', freq: 659.25 },
          { note: 'D5', freq: 587.33 },
          { note: null, freq: 0 },
        ];
        function playNoteFallback(freq, durationSec = 0.42, gainLevel = 0.055) {
          if (!freq) return;
          try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;
            if (!audioCtx) audioCtx = new Ctx();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, now);
            gain.gain.setValueAtTime(0.001, now);
            gain.gain.exponentialRampToValueAtTime(gainLevel, now + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0008, now + durationSec);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + durationSec + 0.02);
          } catch (err) {
            console.warn('Web Audio fallback error:', err);
          }
        }
        function triggerSingleNote(item) {
          if (!item || !item.freq) return;
          if (window.Tone && toneSynth) {
            try {
              toneSynth.triggerAttackRelease(item.note, '8n');
              return;
            } catch (err) {
              // fallback ด้านล่าง
            }
          }
          playNoteFallback(item.freq, 0.46, 0.05);
        }
        async function start() {
          if (isPlaying) return;
          isPlaying = true;
          uiState.musicPlaying = true;
          updateMusicButtonUi();
          // ปลดล็อกเสียง Web Audio ทันทีในจังหวะแตะหน้าจอ (รองรับ Safari บน iPhone/iPad)
          try {
            const Ctx = window.AudioContext || window.webkitAudioContext;
            if (Ctx) {
              if (!audioCtx) audioCtx = new Ctx();
              if (audioCtx.state === 'suspended') {
                audioCtx.resume().catch(() => {});
              }
            }
          } catch (err) {
            // ข้ามหากเบราว์เซอร์ไม่รองรับ
          }
          // เล่นโน้ตแรกทันทีเพื่อให้มีเสียงออกทันทีเมื่อแตะหน้าจอ
          triggerSingleNote(melody[stepIdx % melody.length]);
          stepIdx = (stepIdx + 1) % melody.length;
          clearInterval(loopTimer);
          loopTimer = setInterval(() => {
            if (!isPlaying) return;
            triggerSingleNote(melody[stepIdx % melody.length]);
            stepIdx = (stepIdx + 1) % melody.length;
          }, 420);
          if (window.Tone) {
            try {
              await window.Tone.start();
              if (!toneSynth) {
                toneSynth = new window.Tone.PolySynth(window.Tone.Synth, {
                  oscillator: { type: 'triangle' },
                  envelope: { attack: 0.02, decay: 0.25, sustain: 0.08, release: 0.7 },
                }).toDestination();
                toneSynth.volume.value = -16;
              }
            } catch (err) {
              toneSynth = null;
            }
          }
        }
        function stop() {
          isPlaying = false;
          uiState.musicPlaying = false;
          clearInterval(loopTimer);
          loopTimer = null;
          updateMusicButtonUi();
        }
        function toggle() {
          if (isPlaying) {
            stop();
            showToast('ปิดเสียงเพลงแล้วค่ะ');
          } else {
            start();
            showToast('เปิดเสียงเพลงกล่องดนตรีแล้วค่ะ 🎵');
          }
        }
        function playCuteChime() {
          if (!isPlaying) return;
          playNoteFallback(1046.5, 0.18, 0.045);
          setTimeout(() => playNoteFallback(1318.5, 0.24, 0.04), 90);
        }
        return { toggle, start, stop, playCuteChime };
      })();
      /**
       * ลูกเล่นแสงฟุ้งพาสเทลเวลาแตะหน้าจอ (ใช้แสงเบลอ วงแสง และประกาย SVG ไม่มีอิโมจิ)
       */
      function spawnTapMistEffect(clientX, clientY) {
        const layer = document.getElementById('tap-mist-layer');
        if (!layer || typeof clientX !== 'number' || typeof clientY !== 'number') return;
        // 1) แสงฟุ้งละมุนตรงจุดที่แตะ
        const aura = document.createElement('span');
        aura.className = 'tap-mist-aura';
        aura.style.left = `${clientX}px`;
        aura.style.top = `${clientY}px`;
        layer.appendChild(aura);
        // 2) วงแหวนแสงบาง ๆ ขยายออก
        const ring = document.createElement('span');
        ring.className = 'tap-mist-ring';
        ring.style.left = `${clientX}px`;
        ring.style.top = `${clientY}px`;
        layer.appendChild(ring);
        // 3) ละอองแสงกลมฟุ้งกระจายรอบจุดแตะ
        const orbCount = 5;
        for (let i = 0; i < orbCount; i += 1) {
          const orb = document.createElement('span');
          const angle = (Math.PI * 2 * i) / orbCount + (Math.random() * 0.7 - 0.35);
          const dist = 22 + Math.random() * 24;
          const size = 7 + Math.random() * 7;
          orb.className = 'tap-mist-orb';
          orb.style.left = `${clientX}px`;
          orb.style.top = `${clientY}px`;
          orb.style.width = `${size}px`;
          orb.style.height = `${size}px`;
          orb.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
          orb.style.setProperty('--dy', `${Math.sin(angle) * dist - 8}px`);
          layer.appendChild(orb);
          setTimeout(() => orb.remove(), 820);
        }
        // 4) ประกาย 4 แฉกพาสเทลแบบ SVG 2 ดวง (ไม่ใช้อิโมจิ)
        for (let j = 0; j < 2; j += 1) {
          const spark = document.createElement('span');
          const angle = Math.random() * Math.PI * 2;
          const dist = 18 + Math.random() * 20;
          const sz = 10 + Math.random() * 5;
          spark.className = 'tap-mist-spark';
          spark.style.left = `${clientX}px`;
          spark.style.top = `${clientY}px`;
          spark.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
          spark.style.setProperty('--dy', `${Math.sin(angle) * dist - 10}px`);
          spark.innerHTML = `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.3 9.7L22 12L14.3 14.3L12 22L9.7 14.3L2 12L9.7 9.7L12 2Z" fill="${j === 0 ? '#FF9AC0' : '#FFFFFF'}"/></svg>`;
          layer.appendChild(spark);
          setTimeout(() => spark.remove(), 860);
        }
        setTimeout(() => {
          aura.remove();
          ring.remove();
        }, 820);
      }

      function downloadQueueCardPng(queue, details, statusMeta) {
        try {
          const canvas = document.createElement('canvas');
          canvas.width = 760;
          canvas.height = 920;
          const ctx = canvas.getContext('2d');
          if (!ctx) return;
          const bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
          bgGrad.addColorStop(0, '#FFE6F0');
          bgGrad.addColorStop(0.5, '#FFF5F9');
          bgGrad.addColorStop(1, '#FCE4EE');
          ctx.fillStyle = bgGrad;
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          const drawRoundRect = (x, y, w, h, r) => {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.arcTo(x + w, y, x + w, y + h, r);
            ctx.arcTo(x + w, y + h, x, y + h, r);
            ctx.arcTo(x, y + h, x, y, r);
            ctx.arcTo(x, y, x + w, y, r);
            ctx.closePath();
          };
          drawRoundRect(56, 56, 648, 808, 46);
          ctx.fillStyle = '#FFFFFF';
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = '#F7C9DC';
          ctx.stroke();
          ctx.textAlign = 'center';
          ctx.fillStyle = '#D45C88';
          ctx.font = '600 26px "Prompt", sans-serif';
          ctx.fillText(`♡  ${appData.shopName || 'ครัวของเนเมล 🐤'}  ♡`, 380, 128);
          ctx.fillStyle = '#967274';
          ctx.font = '500 24px "Prompt", sans-serif';
          ctx.fillText(queue.customerName ? `บัตรคิวของ ${queue.customerName}` : 'บัตรคิวของคุณ', 380, 190);
          ctx.fillStyle = '#5C2F2B';
          ctx.font = '700 88px "Mitr", "Prompt", sans-serif';
          ctx.fillText(queue.code, 380, 292);
          drawRoundRect(235, 326, 290, 56, 28);
          ctx.fillStyle = statusMeta.hexBg || '#FCE7EF';
          ctx.fill();
          ctx.fillStyle = statusMeta.hexText || '#C84A76';
          ctx.font = '600 26px "Prompt", sans-serif';
          ctx.fillText(`${statusMeta.label} • ${details.progressPercent}%`, 380, 363);
          ctx.setLineDash([10, 10]);
          ctx.beginPath();
          ctx.moveTo(110, 424);
          ctx.lineTo(650, 424);

          ctx.stroke();
          ctx.setLineDash([]);
          const rows = [
            ['รายการ', queue.service || '-'],
            ['กำหนดเสริฟ', queue.dueDate || 'ตามลำดับคิว'],

            ['อัปเดตล่าสุด', queue.updatedAt || 'วันนี้'],

          ctx.textAlign = 'center';
          ctx.fillStyle = '#D96691';
          ctx.font = '500 21px "Prompt", sans-serif';
          ctx.fillText('ขอบคุณที่ไว้วางใจและรอคิวนะคะ ♡', 380, 818);

      function handleQueueSearch(rawValue) {
        const normalized = normalizeQueueCode(rawValue);
        if (!normalized) {
          uiState.searchError = 'กรุณากรอกรหัสคิวก่อนค้นหานะคะ (เช่น Q-01)';
          uiState.searchInputValue = '';
          renderApp();
          const inputEl = document.getElementById('queue-code-input');
          if (inputEl) inputEl.focus();
          return;
        }
        const matchedQueue = findQueueByCode(normalized);
        if (!matchedQueue) {
          uiState.searchInputValue = rawValue.trim();
          uiState.searchError = `ไม่พบรหัสคิว “${normalized}” ในระบบ กรุณาตรวจสอบและลองค้นหาใหม่นะคะ`;
          renderApp();
          const inputEl = document.getElementById('queue-code-input');
          if (inputEl) inputEl.focus();
          return;
        }
        uiState.searchError = '';
        uiState.searchInputValue = matchedQueue.code;
        uiState.selectedQueueCode = matchedQueue.code;
        uiState.activeView = 'my-queue';
        CuteMusicBox.playCuteChime();
        renderApp();
      }

        const container = document.getElementById('app-content');

              ${dataError ? '<button type="button" id="retry-data" class="btn-rose-solid px-4 py-2 rounded-full">ลองอีกครั้ง</button>' : ''}
            </div>`;
          container.querySelector('#retry-data')?.addEventListener('click', () => loadPublic({ openLink: true }));
          return;
        }
        if (uiState.activeView === 'my-queue') {
          container.innerHTML = renderMyQueuePage();
        } else if (uiState.activeView === 'all') {
          container.innerHTML = renderAllQueuesPage();
        } else if (uiState.activeView === 'contact') {
          container.innerHTML = renderContactPage();

            }
            if (!customerName || !service) {
              showToast('กรุณากรอกชื่อออเดอร์และเมนูค่ะ');
              return;
            }
            const statusMeta = appData.statusOptions.find(option => option.id === status);
            if (!statusMeta) {
              showToast('กรุณาเลือกสถานะคิวค่ะ');
              return;
            }
            const row = toQueueRow({
              code: rawCode, status, avatarPreset, avatarUrl: httpUrl(avatarUrl), customerName, service,
              dueDate: dueDate || 'ตามลำดับคิว', workStep, details, note,
              usageRights: String(fd.get('usageRights') || '').trim(),
              progressPercent: statusMeta.default_progress,
            });
            writeAdmin(async () => {
              resultOf(await db.from('queues').insert(row).select('id').single());
            }, `เพิ่มคิว ${rawCode} และสร้างลิงก์แล้วค่ะ`, () => {
              uiState.adminTab = 'queues';
              uiState.sharingQueueCode = rawCode;
              uiState.editingQueueCode = null;
              uiState.showInlineTemplateEdit = false;
            });
              });
            }
            
        // แท็บตั้งค่า: ฟอร์มข้อความหลัก
        const settingsTplArea = document.getElementById('settings-template-textarea');
        const settingsTplPreview = document.getElementById('settings-template-preview');
        const saveSettingsTplBtn = document.getElementById('save-settings-template-btn');
        const resetTplBtn = document.getElementById('reset-template-btn');
        if (settingsTplArea && settingsTplPreview) {
          settingsTplArea.addEventListener('input', () => {
            const sampleQueue = appData.queues[appData.queues.length - 1] || TEMPLATE_PREVIEW_QUEUE;
            settingsTplPreview.textContent = formatShareMessage(sampleQueue, settingsTplArea.value);
          });
        }
        if (saveSettingsTplBtn && settingsTplArea) {
          saveSettingsTplBtn.addEventListener('click', () => {
            const val = settingsTplArea.value.trim();
            if (!val) {
              showToast('กรุณากรอกฟอร์มข้อความก่อนบันทึกนะคะ');
              return;
            }
            writeAdmin(() => writeSettings({ share_template: val }), 'บันทึกฟอร์มข้อความเรียบร้อยค่ะ ♡', undefined, false);
          });
        }
        if (resetTplBtn) {
          resetTplBtn.addEventListener('click', () => {
            writeAdmin(() => writeSettings({ share_template: DEFAULT_CONFIG.shareTemplate }), 'คืนค่าฟอร์มข้อความเริ่มต้นแล้วค่ะ');
          });
        }
        // ตั้งค่ารูปมาสคอตหลักและดูหน้าโหลดอีกครั้ง
        const saveMascotBtn = document.getElementById('save-mascot-url-btn');
        const mascotUrlInput = document.getElementById('demo-mascot-url');
        const resetMascotBtn = document.getElementById('reset-mascot-url-btn');
        const replaySplashBtn = document.getElementById('replay-splash-btn');
        if (saveMascotBtn && mascotUrlInput) {
          saveMascotBtn.addEventListener('click', () => {
            const val = mascotUrlInput.value.trim();
            if (val && !/^https?:\/\//i.test(val)) {
              showToast('กรุณาใส่ลิงก์รูปที่ขึ้นต้นด้วย https:// นะคะ');
              return;
            }
            writeAdmin(() => writeSettings({ mascot_image_url: httpUrl(val) || DEFAULT_CONFIG.mascotImageUrl }), 'อัปเดตรูปมาสคอตแล้วค่ะ', undefined, false);
          });
        }
        if (resetMascotBtn) {
          resetMascotBtn.addEventListener('click', () => {
            writeAdmin(() => writeSettings({ mascot_image_url: DEFAULT_CONFIG.mascotImageUrl }), 'คืนค่ารูปมาสคอตแล้วค่ะ');
          });
        }
        if (replaySplashBtn) {
          replaySplashBtn.addEventListener('click', () => {
            uiState.showAdminModal = false;
            renderAdminModal();
            playCuteSplashLoader();
          });
        }
            }
      function initNavigation() {
        // แตะหน้าจอแล้วแสดงแสงฟุ้งนุ่ม ๆ (ไม่ใช้อิโมจิ) + เล่นเพลงกล่องดนตรีอัตโนมัติทันทีในครั้งแรก
        let hasAutoStartedMusic = false;
        let lastMistTime = 0;
        const handleFirstTapAudioAndMist = (clientX, clientY, targetEl) => {
          const now = Date.now();
          if (now - lastMistTime > 60) {
            lastMistTime = now;
            spawnTapMistEffect(clientX, clientY);
          }
          const isMusicBtn = targetEl && typeof targetEl.closest === 'function' && targetEl.closest('#music-toggle-btn');
          if (!hasAutoStartedMusic && !isMusicBtn) {
            hasAutoStartedMusic = true;
            if (!uiState.musicPlaying) {
              CuteMusicBox.start();
            }
          }
        };
        document.addEventListener(
          'pointerdown',
          (e) => {
            if (e.isPrimary === false) return;
            handleFirstTapAudioAndMist(e.clientX, e.clientY, e.target);
          },
          { passive: true }
        );
        document.querySelectorAll('[data-nav]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const target = btn.getAttribute('data-nav');
            if (!target) return;
            uiState.activeView = target;
            if (target === 'check') {
              uiState.searchError = '';
            }
            renderApp();
          });
        });
        const gearBtn = document.getElementById('open-admin-gear-btn');
        if (gearBtn) {
          gearBtn.addEventListener('click', async () => {
          if (busy || gearBtn.disabled) return;
          gearBtn.disabled = true;
          try {
            admin = await verifyAdmin();
            if (admin) await loadPublic();
          } catch (error) {
            admin = false;
            console.warn(error);
          } finally {
            gearBtn.disabled = false;
          }
            uiState.showAdminModal = true;
            renderAdminModal();
          });
        }
        const adminModal = document.getElementById('admin-modal');
        if (adminModal) {
          adminModal.addEventListener('click', (e) => {
            if (e.target === adminModal) {
              uiState.showAdminModal = false;
              uiState.confirmDeleteCode = null;
              renderAdminModal();
            }
          });
        }
        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            if (uiState.showAdminModal) {
              uiState.showAdminModal = false;
              uiState.confirmDeleteCode = null;
              renderAdminModal();
            }
            if (uiState.downloadModalCode) {
              uiState.downloadModalCode = null;
              renderDownloadCardModal();
            }
          }
        });
        const musicBtn = document.getElementById('music-toggle-btn');
        if (musicBtn) {
          musicBtn.addEventListener('click', () => {
            hasAutoStartedMusic = true;
            CuteMusicBox.toggle();
          });
        }
        const splashEl = document.getElementById('cute-splash-loader');
        if (splashEl) {
          splashEl.addEventListener('click', () => {
            clearInterval(splashTimer);
            splashEl.classList.add('splash-hidden');
          });
        }
        const dlModal = document.getElementById('download-card-modal');
        if (dlModal) {
          dlModal.addEventListener('click', (e) => {
            if (e.target === dlModal) {
              uiState.downloadModalCode = null;
              renderDownloadCardModal();
            }
          });
        }
      }
      /* =======================================================================
         7) เริ่มต้นการทำงานของเว็บแอปเมื่อโหลดหน้าเสร็จ
         ======================================================================= */
      function startApp() {
        initNavigation();
        uiState.searchInputValue = '';
        renderApp();
        playCuteSplashLoader();
      void loadPublic({ openLink: true });
      window.addEventListener('focus', () => {
        if (!uiState.showAdminModal && !uiState.downloadModalCode && !busy) void loadPublic();
      });
      }
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', startApp);
      } else {
        startApp();
      }
      window.addEventListener('hashchange', () => {
        if (applyQueueFromUrlIfPresent()) {
          renderApp();
        }
      });
    })();
  </script>
</body>
</html>
